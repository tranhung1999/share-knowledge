spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  jwt:
    secret: TestSecretKeyForJwtTokenThatIsAtLeast32Characters
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  file-storage:
    type: local
    local:
      upload-dir: ./target/test-uploads

logging:
  level:
    root: WARN
    com.expense: INFO
