version: '3.9'

services:
  # ─── PostgreSQL Database ──────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: expense_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       expense_db
      POSTGRES_USER:     expense_user
      POSTGRES_PASSWORD: expense_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_user -d expense_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - expense_net

  # ─── Spring Boot Backend ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL:                jdbc:postgresql://postgres:5432/expense_db
      DB_USERNAME:           expense_user
      DB_PASSWORD:           expense_pass
      JWT_SECRET:            ${JWT_SECRET:-YourSuperSecretKeyForProductionUseMinimum32Chars}
      JWT_ACCESS_EXPIRY:     ${JWT_ACCESS_EXPIRY:-900000}
      UPLOAD_DIR:            /app/uploads
      SERVER_PORT:           8080
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - expense_net

  # ─── React Frontend ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - expense_net

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  expense_net:
    driver: bridge
